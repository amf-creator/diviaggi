<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diviaggi — Espéralo pronto</title>
<meta name="description" content="Muy pronto, la experiencia Diviaggi para viajeros. Un viaje, es muchos viajes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf8f5;
    --ink:#1f1c19;
    --muted:#8a8378;
    --accent:#b08d57;      /* dorado suave */
    --brand:#3a4968;       /* azul Diviaggi */
    --white:#ffffff;
    --serif:'Cormorant Garamond', Georgia, serif;
    --sans:'Inter', -apple-system, system-ui, sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:var(--sans);
    color:var(--ink);
    background:var(--bg);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
    position:relative;
  }

  /* ---- atmósfera de fondo ---- */
  .aura{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
  .orb{
    position:absolute;border-radius:50%;filter:blur(70px);
    opacity:.34;will-change:transform;
  }
  .orb-a{width:52vw;height:52vw;left:-14vw;top:-16vw;
    background:radial-gradient(circle at 40% 40%, rgba(176,141,87,.55), rgba(176,141,87,0) 68%);
    animation:drift1 26s ease-in-out infinite alternate;}
  .orb-b{width:58vw;height:58vw;right:-18vw;bottom:-22vw;
    background:radial-gradient(circle at 55% 45%, rgba(58,73,104,.42), rgba(58,73,104,0) 68%);
    animation:drift2 32s ease-in-out infinite alternate;}
  .orb-c{width:34vw;height:34vw;left:52%;top:8%;
    background:radial-gradient(circle at 50% 50%, rgba(176,141,87,.30), rgba(176,141,87,0) 70%);
    animation:drift3 22s ease-in-out infinite alternate;}
  @keyframes drift1{to{transform:translate3d(7vw,5vh,0) scale(1.12)}}
  @keyframes drift2{to{transform:translate3d(-8vw,-5vh,0) scale(1.1)}}
  @keyframes drift3{to{transform:translate3d(-5vw,7vh,0) scale(.9)}}

  /* grano finísimo para que no se vea plano */
  .grain{
    position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.045;
    background-image:radial-gradient(rgba(31,28,25,.9) .5px, transparent .5px);
    background-size:3px 3px;
  }

  /* marco dorado */
  .frame{
    position:fixed;inset:clamp(14px,2.2vw,26px);z-index:2;pointer-events:none;
    border:1px solid rgba(176,141,87,.34);
  }
  .frame::before,.frame::after{
    content:"";position:absolute;width:9px;height:9px;border:1px solid var(--accent);
  }
  .frame::before{left:-5px;top:-5px;border-right:none;border-bottom:none}
  .frame::after{right:-5px;bottom:-5px;border-left:none;border-top:none}

  /* ---- contenido ---- */
  .stage{
    position:relative;z-index:3;
    min-height:100%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;
    padding:clamp(48px,9vh,96px) clamp(24px,6vw,64px);
  }

  .logo-wrap{position:relative;display:inline-block;overflow:hidden;padding:4px 10px}
  .logo{
    max-width:min(360px,74vw);max-height:170px;display:block;
    opacity:0;transform:translateY(14px) scale(.96);
    animation:rise 1.5s cubic-bezier(.2,.7,.2,1) .15s forwards;
  }
  .logo-text{
    font-family:var(--serif);font-weight:500;letter-spacing:.05em;
    font-size:clamp(46px,10vw,96px);color:var(--ink);line-height:1;
    opacity:0;transform:translateY(14px);
    animation:rise 1.5s cubic-bezier(.2,.7,.2,1) .15s forwards;
  }
  .logo-wrap::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(105deg, transparent 38%, rgba(255,255,255,.85) 50%, transparent 62%);
    transform:translateX(-130%);
    animation:sheen 5.5s ease-in-out 1.7s infinite;
  }

  .rule{
    width:0;height:1px;background:var(--accent);
    margin:30px auto 26px;
    animation:ruleGrow 1.2s ease 1s forwards;
  }

  .eyebrow{
    font-family:var(--sans);font-size:clamp(10px,1.6vw,12px);
    letter-spacing:.42em;text-transform:uppercase;color:var(--muted);font-weight:400;
    opacity:0;animation:rise 1s ease 1.35s forwards;
  }

  h1{
    font-family:var(--serif);font-style:italic;font-weight:500;
    font-size:clamp(44px,9.5vw,104px);line-height:1.02;letter-spacing:.01em;
    color:var(--brand);margin:16px 0 0;
    opacity:0;animation:rise 1.2s cubic-bezier(.2,.7,.2,1) 1.5s forwards;
  }

  .lede{
    font-family:var(--serif);font-weight:400;
    font-size:clamp(18px,2.9vw,27px);line-height:1.45;color:#57514a;
    max-width:600px;margin:20px auto 0;
    opacity:0;animation:rise 1.1s ease 1.95s forwards;
  }
  .lede em{font-style:italic;color:var(--muted)}

  .actions{
    display:flex;gap:12px;flex-wrap:wrap;justify-content:center;
    margin-top:clamp(30px,5vh,44px);
    opacity:0;animation:rise 1.1s ease 2.35s forwards;
  }
  .cta{
    display:inline-flex;align-items:center;gap:9px;
    font-family:var(--sans);font-size:13px;font-weight:500;letter-spacing:.04em;
    padding:13px 26px;border-radius:40px;text-decoration:none;white-space:nowrap;
    transition:transform .25s ease, box-shadow .25s ease, background .25s ease, color .25s ease, border-color .25s ease;
  }
  .cta svg{width:17px;height:17px;flex:none;display:block}
  .cta-solid{background:var(--brand);color:#fff;border:1px solid var(--brand);box-shadow:0 5px 16px rgba(58,73,104,.30)}
  .cta-solid:hover{transform:translateY(-2px);box-shadow:0 9px 24px rgba(58,73,104,.46)}
  .cta-ghost{background:rgba(255,255,255,.65);color:var(--brand);border:1px solid rgba(58,73,104,.45)}
  .cta-ghost:hover{background:var(--brand);color:#fff;border-color:var(--brand);transform:translateY(-2px)}

  /* ---- pie ---- */
  .foot{
    position:fixed;left:0;right:0;bottom:0;z-index:3;
    display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
    padding:0 clamp(28px,6vw,64px) 26px;
    color:var(--muted);font-size:11px;letter-spacing:.05em;
    opacity:0;animation:rise 1s ease 2.7s forwards;
  }
  .foot a{color:var(--muted);text-decoration:none}
  .foot-left a{border-bottom:1px solid rgba(31,28,25,.2)}
  .foot-left a:hover{color:var(--accent);border-color:var(--accent)}
  .foot-sep{opacity:.5;margin:0 3px}
  .foot-social{display:flex;align-items:center;gap:16px}
  .foot-social a{color:var(--ink);opacity:.72;display:inline-flex;transition:opacity .25s ease, transform .25s ease, color .25s ease}
  .foot-social a:hover{opacity:1;color:var(--accent);transform:translateY(-2px)}
  .foot-social svg{width:19px;height:19px;display:block}

  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  @keyframes ruleGrow{to{width:min(230px,58vw)}}
  @keyframes sheen{
    0%{transform:translateX(-130%)}
    22%{transform:translateX(130%)}
    100%{transform:translateX(130%)}
  }

  @media (max-width:640px){
    body{overflow-y:auto}
    .stage{min-height:100vh;padding-bottom:130px}
    .foot{flex-direction:column;justify-content:center;gap:10px;text-align:center;padding:0 16px 18px}
    .foot-social{order:1;gap:20px}
    .foot-left{order:2}
    .orb{filter:blur(52px)}
  }
  @media (prefers-reduced-motion:reduce){
    .orb,.logo-wrap::after{animation:none}
  }
</style>
</head>
<body>

  <div class="aura">
