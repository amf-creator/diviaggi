<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diviaggi — Un viaje, es muchos viajes</title>
<meta name="description" content="Diviaggi — Agencia de viajes. Descubre nuestros destinos: México, Cruceros, Europa, Japón y mucho más.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf8f5;
    --ink:#1f1c19;
    --muted:#8a8378;
    --line:#e7e1d8;
    --accent:#b08d57;      /* dorado suave */
    --brand:#3a4968;       /* azul Diviaggi */
    --white:#ffffff;
    --serif:'Cormorant Garamond', Georgia, serif;
    --sans:'Inter', -apple-system, system-ui, sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:var(--sans);
    color:var(--ink);
    background:var(--bg);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  /* ============ INTRO ============ */
  #intro{
    position:fixed;
    inset:0;
    z-index:100;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
    transition:opacity 1s ease, visibility 1s ease;
  }
  #intro.hide{opacity:0;visibility:hidden;pointer-events:none}

  .intro-logo{
    max-width:min(340px,70vw);
    max-height:160px;
    opacity:0;
    transform:scale(.9);
    animation:logoIn 1.6s cubic-bezier(.2,.7,.2,1) .2s forwards;
  }
  .intro-logo-text{
    font-family:var(--serif);
    font-size:clamp(48px,11vw,104px);
    font-weight:500;
    letter-spacing:.04em;
    color:var(--ink);
    opacity:0;
    transform:scale(.92);
    animation:logoIn 1.6s cubic-bezier(.2,.7,.2,1) .2s forwards;
  }
  .intro-slogan{
    margin-top:22px;
    font-family:var(--serif);
    font-size:clamp(20px,4vw,34px);
    line-height:1.3;
    color:var(--ink);
  }
  .intro-slogan span{display:block;opacity:0}
  .intro-slogan .w1{
    font-style:italic;color:var(--muted);
    animation:fadeUp 1s ease 1.5s forwards;
  }
  .intro-slogan .w2{
    font-weight:500;letter-spacing:.01em;
    animation:fadeUp 1s ease 2.1s forwards;
  }
  .intro-rule{
    width:0;
    height:1px;
    background:var(--accent);
    margin:28px auto 22px;
    animation:ruleGrow 1s ease 2.8s forwards;
  }
  .intro-status{
    font-size:clamp(13px,2.2vw,16px);
    letter-spacing:.32em;
    text-transform:uppercase;
    color:var(--muted);
    font-weight:400;
    opacity:0;
    animation:fadeUp 1.1s ease 3.3s forwards;
  }
  @keyframes logoIn{from{opacity:0;transform:translateY(16px) scale(.94)}to{opacity:1;transform:translateY(0) scale(1)}}
  @keyframes ruleGrow{to{width:min(220px,60vw)}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

  /* ============ HEADER ============ */
  header{
    position:fixed;top:0;left:0;right:0;z-index:20;
    display:flex;align-items:center;justify-content:space-between;
    padding:22px clamp(20px,5vw,56px);
    background:linear-gradient(to bottom, rgba(255,255,255,.7), rgba(255,255,255,0));
  }
  .brand{
    font-family:var(--serif);
    font-size:26px;font-weight:600;letter-spacing:.06em;
    color:var(--ink);text-decoration:none;
    display:flex;align-items:center;gap:12px;
  }
  .brand img{height:34px;width:auto;max-width:100%}
  .brand-tag{
    font-family:var(--sans);font-size:11px;letter-spacing:.28em;
    text-transform:uppercase;color:var(--muted);font-weight:400;
  }
  .header-cta{display:flex;gap:10px;align-items:center}
  .cta{
    display:inline-flex;align-items:center;gap:8px;
    font-family:var(--sans);font-size:13px;font-weight:500;letter-spacing:.02em;
    padding:10px 18px;border-radius:40px;text-decoration:none;white-space:nowrap;
    transition:transform .2s ease, box-shadow .2s ease, background .2s ease, color .2s ease, border-color .2s ease;
  }
  .cta svg{width:17px;height:17px;display:block;flex:none}
  .cta-wa{background:var(--brand);color:#fff;box-shadow:0 4px 14px rgba(58,73,104,.30)}
  .cta-wa:hover{transform:translateY(-2px);box-shadow:0 7px 20px rgba(58,73,104,.44)}
  .cta-mail{background:rgba(255,255,255,.72);color:var(--brand);border:1px solid var(--brand)}
  .cta-mail:hover{background:var(--brand);color:#fff;border-color:var(--brand);transform:translateY(-2px)}
  @media (max-width:600px){
    .cta{padding:10px}
    .cta .label{display:none}
  }

  /* ============ SLIDER (galería de slides diseñados) ============ */
  #slider{position:relative;height:100vh;height:100svh;width:100%;overflow:hidden;background:var(--bg)}
  .slide{
    position:absolute;inset:0;
    opacity:0;visibility:hidden;
    transition:opacity 1s ease;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    padding:80px clamp(56px,9vw,120px) 74px;
  }
  .slide.active{opacity:1;visibility:visible}
  .slide-photo{
    max-width:100%;max-height:calc(100% - 92px);width:auto;height:auto;
    object-fit:contain;display:block;
    border-radius:6px;
    box-shadow:0 16px 46px rgba(31,28,25,.16);
    transform:scale(.985);opacity:.5;
    transition:transform 1s ease, opacity 1s ease;
  }
  .slide.active .slide-photo{transform:scale(1);opacity:1}
  .slide-cap{
    text-align:center;max-width:780px;margin:0;
    opacity:0;transform:translateY(8px);
    transition:opacity .8s ease .25s, transform .8s ease .25s;
  }
  .slide.active .slide-cap{opacity:1;transform:translateY(0)}
  .slide-cap h2{
    font-family:var(--serif);font-weight:500;letter-spacing:.01em;line-height:1.05;margin:0;
    font-size:clamp(24px,3.6vw,38px);color:var(--brand);
  }
  .slide-cap p{
    font-family:var(--sans);font-weight:300;line-height:1.5;margin:8px 0 0;
    font-size:clamp(13px,1.7vw,16px);color:#57514a;
  }
  @media (max-width:640px){
    .slide{padding:58px 12px 118px;gap:12px}
    .slide-photo{max-height:calc(100% - 122px)}
    .slide-cap{max-width:92vw}
    .slide-cap h2{font-size:22px}
    .slide-cap p{
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
      font-size:12.5px;line-height:1.45;margin-top:6px;
    }
  }

  /* controls */
  .nav-arrow{
    position:absolute;top:50%;transform:translateY(-50%);
    z-index:10;
    width:52px;height:52px;border-radius:50%;
    border:1px solid rgba(31,28,25,.28);
    background:rgba(255,255,255,.45);
    color:var(--ink);cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    font-size:20px;
    transition:background .3s ease, border-color .3s ease;
    backdrop-filter:blur(2px);
  }
  .nav-arrow:hover{background:rgba(255,255,255,.85);border-color:var(--accent)}
  .nav-prev{left:clamp(14px,3vw,34px)}
  .nav-next{right:clamp(14px,3vw,34px)}

  .dots{
    position:absolute;bottom:28px;left:50%;transform:translateX(-50%);
    z-index:10;display:flex;gap:9px;flex-wrap:wrap;justify-content:center;
    max-width:90vw;
  }
  .dot{
    width:9px;height:9px;border-radius:50%;
    background:rgba(31,28,25,.25);border:none;cursor:pointer;padding:0;
    transition:background .3s ease, transform .3s ease;
  }
  .dot.active{background:var(--accent);transform:scale(1.25)}

  .progress{
    position:absolute;top:0;left:0;height:3px;z-index:10;
    background:var(--accent);width:0;
  }

  /* ============ FOOTER STRIP ============ */
  .foot{
    position:absolute;bottom:0;left:0;right:0;z-index:5;
    display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;
    padding:0 clamp(20px,5vw,56px) 20px;
    color:var(--muted);font-size:12px;letter-spacing:.05em;
    pointer-events:none;
  }
  .foot-left{pointer-events:auto;font-size:11px}
  .foot-left a{color:var(--muted);text-decoration:none;border-bottom:1px solid rgba(31,28,25,.2)}
  .foot-left a:hover{color:var(--accent);border-color:var(--accent)}
  .foot-sep{color:var(--muted);opacity:.5;margin:0 3px}
  .foot-social{display:flex;align-items:center;gap:16px;pointer-events:auto}
  .foot-social a{
    color:var(--ink);opacity:.72;display:inline-flex;
    transition:opacity .25s ease, transform .25s ease, color .25s ease;
  }
  .foot-social a:hover{opacity:1;color:var(--accent);transform:translateY(-2px)}
  .foot-social svg{width:20px;height:20px;display:block}

  @media (max-width:640px){
    .brand-tag{display:none}
    header{padding:16px 16px}
    .brand img{height:28px}
    .header-cta{gap:8px}
    .nav-arrow{width:40px;height:40px;font-size:18px;background:rgba(255,255,255,.7)}
    .dots{bottom:80px}
    .foot{
      flex-direction:column;align-items:center;justify-content:center;
      gap:9px;text-align:center;font-size:11px;padding:0 16px 16px;
    }
    .foot-social{order:1;gap:20px}
    .foot-left{order:2}
  }

  /* ============ ACCESOS JUNTO AL LOGO ============ */
  .brand-group{display:flex;align-items:center;min-width:0}
  .head-access{
    display:flex;align-items:center;gap:9px;
    margin-left:clamp(14px,2.4vw,26px);
    padding-left:clamp(14px,2.4vw,26px);
    border-left:1px solid rgba(31,28,25,.16);
    opacity:0;transform:translateY(-6px);
    transition:opacity .8s ease, transform .8s ease;
  }
  .head-access.show{opacity:1;transform:translateY(0)}

  .btn-access{
    display:inline-flex;align-items:center;gap:7px;
    font-family:var(--sans);text-decoration:none;white-space:nowrap;
    border-radius:40px;
    transition:transform .22s ease, box-shadow .22s ease, background .22s ease, color .22s ease, border-color .22s ease;
  }
  .btn-access svg{flex:none;display:block}
  .btn-agentes{
    font-size:10.5px;font-weight:500;letter-spacing:.15em;text-transform:uppercase;
    padding:8px 14px;
    background:rgba(255,255,255,.72);color:var(--brand);border:1px solid var(--brand);
  }
  .btn-agentes svg{width:13px;height:13px}
  .btn-agentes:hover{background:var(--brand);color:#fff;transform:translateY(-2px)}
  .btn-viajeros{
    font-size:12.5px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;
    padding:11px 22px;
    background:var(--brand);color:#fff;border:1px solid var(--brand);
    box-shadow:0 4px 14px rgba(58,73,104,.30);
  }
  .btn-viajeros svg{width:15px;height:15px}
  .btn-viajeros:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(58,73,104,.44)}

  .viajeros-wrap{position:relative;display:inline-flex}
  .soon{
    position:absolute;left:50%;top:calc(100% + 12px);transform:translate(-50%,-6px);
    background:var(--white);color:var(--brand);
    border:1px solid var(--accent);border-radius:10px;
    padding:8px 16px;
    font-family:var(--serif);font-style:italic;font-size:17px;line-height:1;white-space:nowrap;
    box-shadow:0 10px 26px rgba(31,28,25,.16);
    opacity:0;visibility:hidden;
    transition:opacity .28s ease, transform .28s ease, visibility .28s ease;
  }
  .soon::after{
    content:"";position:absolute;left:50%;margin-left:-6px;bottom:100%;
    border:6px solid transparent;border-bottom-color:var(--accent);
  }
  .viajeros-wrap:hover .soon,
  .viajeros-wrap:focus-within .soon,
  .viajeros-wrap.on .soon{opacity:1;visibility:visible;transform:translate(-50%,0)}

  /* un poco más de aire arriba para que el header no tape la foto */
  .slide{padding-top:96px}

  @media (max-width:900px){
    .brand-group{flex:1 1 auto;flex-wrap:wrap;row-gap:10px}
    .brand{flex:0 0 auto}
    .head-access{
      flex-basis:100%;
      margin-left:0;padding-left:0;border-left:none;
    }
    .soon{left:auto;right:auto;transform:translate(0,-6px);margin-left:0}
    .viajeros-wrap:hover .soon,
    .viajeros-wrap:focus-within .soon,
    .viajeros-wrap.on .soon{transform:translate(0,0)}
    .soon::after{left:32px}
    .slide{padding-top:134px}
  }
  @media (max-width:640px){
    .brand img{height:22px}
    .btn-agentes{font-size:8.5px;letter-spacing:.1em;padding:7px 10px;gap:5px}
    .btn-agentes svg{width:12px;height:12px}
    .btn-viajeros{font-size:10.5px;letter-spacing:.09em;padding:9px 16px;gap:6px}
    .btn-viajeros svg{width:13px;height:13px}
    .soon{font-size:15px;padding:7px 13px}
    .slide{padding-top:120px}
  }
</style>
</head>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  // Cargador tolerante de imágenes: si no encuentra el .jpg, prueba otras extensiones
  var IMG_EXTS = ['jpeg','png','webp','JPG','JPEG','PNG','Jpg'];
  function tryImg(img){
    var n = parseInt(img.getAttribute('data-try') || '0', 10);
    if(n < IMG_EXTS.length){
      img.setAttribute('data-try', n + 1);
      img.src = img.src.replace(/\.[^./?#]+($|[?#])/, '.' + IMG_EXTS[n] + '$1');
    } else {
      img.onerror = null;
      img.style.display = 'none';
    }
  }

  // Ocultar intro después de la secuencia de animación (~5.5s)
  setTimeout(function(){
    document.getElementById('intro').classList.add('hide');
    var ac = document.getElementById('access');
    if(ac) ac.classList.add('show');
  }, 6500);

  // ===== Slider =====
  var slides = Array.prototype.slice.call(document.querySelectorAll('.slide'));
  var dotsWrap = document.getElementById('dots');
  var progress = document.getElementById('progress');
  var current = 0;
  var DURATION = 6000; // ms por slide
  var timer, rafId, startTime;

  // título + descripción debajo de cada slide
  var TITLES = [
    'Destinos México','Cruceros','Clásicos Norteamérica','Caribe',
    'Clásicos de Europa','Destinos Sudamérica','Japón','Sureste Asiático',
    'Destinos Ski','Islandia','Alaska','India'
  ];
  var DESCS = [
    'Playas del Caribe, pueblos mágicos y cultura milenaria. Todo el color de México a tu alcance.',
    'Despierta en un puerto distinto cada mañana. Lujo, gastronomía y mar abierto sin equipaje que mover.',
    'Nueva York, Los Ángeles, Las Vegas y los grandes parques nacionales. La energía de un continente entero.',
    'Arena blanca, agua turquesa y resorts todo incluido. El descanso perfecto bajo el sol.',
    'París, Roma, Londres y las capitales que nunca pasan de moda. Historia, arte y encanto en cada esquina.',
    'Machu Picchu, Patagonia, Río y Buenos Aires. Paisajes imposibles y culturas vibrantes de sur a norte.',
    'Templos y tecnología, cerezos y tradición. Tokio, Kioto y una cultura que fascina en cada detalle.',
    'Tailandia, Vietnam, Camboya y Bali. Templos milenarios, playas de ensueño y una cultura que enamora.',
    'Las mejores pistas de los Alpes y Norteamérica. Nieve perfecta, cabañas acogedoras y aventura en las alturas.',
    'Volcanes, cascadas y auroras. Un paisaje de otro planeta bajo el cielo del norte.',
    'Glaciares, fiordos y auroras boreales. Naturaleza en estado puro en la última gran frontera.',
    'El Taj Mahal, los colores de Rajastán y la espiritualidad del Ganges. Un viaje que despierta los sentidos.'
  ];
  slides.forEach(function(s, i){
    var cap = document.createElement('div');
    cap.className = 'slide-cap';
    var h = document.createElement('h2'); h.textContent = TITLES[i] || '';
    var p = document.createElement('p'); p.textContent = DESCS[i] || '';
    cap.appendChild(h); cap.appendChild(p);
    s.appendChild(cap);
  });

  // crear dots
  slides.forEach(function(_, i){
    var b = document.createElement('button');
    b.className = 'dot' + (i===0?' active':'');
    b.setAttribute('aria-label','Ir al destino '+(i+1));
    b.addEventListener('click', function(){ goTo(i); });
    dotsWrap.appendChild(b);
  });
  var dots = Array.prototype.slice.call(dotsWrap.children);

  function render(){
    slides.forEach(function(s,i){ s.classList.toggle('active', i===current); });
    dots.forEach(function(d,i){ d.classList.toggle('active', i===current); });
  }
  function goTo(i){
    current = (i + slides.length) % slides.length;
    render();
    restart();
  }
  function next(){ goTo(current+1); }
  function prev(){ goTo(current-1); }

  function animateProgress(){
    startTime = Date.now();
    cancelAnimationFrame(rafId);
    (function loop(){
      var p = Math.min((Date.now()-startTime)/DURATION, 1);
      progress.style.width = (p*100)+'%';
      if(p<1) rafId = requestAnimationFrame(loop);
    })();
  }
  function restart(){
    clearTimeout(timer);
    timer = setTimeout(next, DURATION);
    animateProgress();
  }

  document.querySelector('.nav-next').addEventListener('click', next);
  document.querySelector('.nav-prev').addEventListener('click', prev);
  document.addEventListener('keydown', function(e){
    if(e.key==='ArrowRight') next();
    if(e.key==='ArrowLeft') prev();
  });

  // swipe en móvil
  var xStart=null;
  document.getElementById('slider').addEventListener('touchstart',function(e){ xStart=e.touches[0].clientX; },{passive:true});
  document.getElementById('slider').addEventListener('touchend',function(e){
    if(xStart===null) return;
    var dx = e.changedTouches[0].clientX - xStart;
    if(Math.abs(dx)>50){ dx<0 ? next() : prev(); }
    xStart=null;
  },{passive:true});

  // aviso "Espéralo pronto" también al tocar en móvil
  (function(){
    var w = document.getElementById('viajerosWrap');
    if(!w) return;
    w.addEventListener('touchstart', function(){ w.classList.add('on'); }, {passive:true});
    document.addEventListener('touchstart', function(e){
      if(!w.contains(e.target)) w.classList.remove('on');
    }, {passive:true});
  })();

  // arrancar el autoplay cuando la intro se retira
  setTimeout(restart, 6600);
</script>
